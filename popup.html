<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>浏览器伪装大师</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <div class="brand">
    <span class="brand-icon">◈</span>
    <div>浏览器伪装大师<small>DISGUISE MASTER</small></div>
    <span class="version" style="margin-left:auto;font-size:10px;">v1.4.1</span>
  </div>

  <div class="card" style="padding:10px 12px;margin-bottom:10px;background:var(--surface-alt);">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
      <h2 id="host" style="margin:0;font-size:13.5px;font-weight:600;">正在读取当前页面…</h2>
    </div>
    <div class="notice" id="state" style="margin:4px 0 6px;padding:5px 8px;font-size:11px;">检查配置中</div>
    <p id="summary" style="margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.45;">按域名设置浏览器环境。</p>
  </div>

  <button type="button" id="sync-ip" class="outline full" style="margin-bottom:6px;" disabled>按当前 IP 更新地区与位置</button>
  <p class="hint">查询 ipwho.is，保存时区、语言、Intl 与大致位置到匹配规则。包含子域名的规则会同步影响这些子域名。更新后固定，IP 改变时请再次更新；不会自动刷新页面。</p>
  <button type="button" id="configure" class="primary full" style="margin-bottom:6px;">配置此域名 <span>↗</span></button>
  <button type="button" id="dashboard" class="outline full">打开域名工作台</button>

  <script type="module" src="popup.js"></script>
</body>
</html>
